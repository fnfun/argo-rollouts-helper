<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Argo Rollouts Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-root">
      <header class="popup-header">
        <span class="popup-title">Argo Rollouts Helper</span>
        <span class="popup-version">v0.1.0</span>
      </header>

      <section class="card">
        <div class="row">
          <span class="label">当前标签页</span>
          <span class="value" id="current-url">-</span>
        </div>
        <div class="row">
          <span class="label">生效状态</span>
          <span class="value" id="current-match">-</span>
        </div>
        <label class="switch-row">
          <input type="checkbox" id="enable-toggle" />
          <span class="switch-slider"></span>
          <span class="switch-text">Promote Full 模式（高危）</span>
        </label>
        <p class="warn" id="enable-warn">
          ⚠️ 开启后所有 Promote 操作将直接全量发布，跳过剩余 step！
        </p>
      </section>

      <section class="card">
        <div class="patterns-header">
          <span class="label">生效 URL 模式</span>
          <span class="hint">每行一个，支持 <code>*</code> 通配符</span>
        </div>
        <textarea id="patterns" rows="6" spellcheck="false" placeholder="https://argo-rollouts.example.com/*"></textarea>
        <div class="actions">
          <button id="add-current">添加当前页</button>
          <button id="reset-default">恢复默认</button>
          <button id="save" class="primary">保存</button>
        </div>
        <p class="hint" id="save-hint"></p>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
