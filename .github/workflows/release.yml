name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "value=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          zip -r argo-rollup-helper-${{ steps.ver.outputs.value }}.zip \
            manifest.json src/ icons/

      - name: Publish release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            argo-rollup-helper-${{ steps.ver.outputs.value }}.zip
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
