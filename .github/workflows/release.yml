name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crx3
        run: npm install -g crx3

      - name: Get version
        id: ver
        run: echo "value=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Write signing key
        run: echo "${{ secrets.CRX_PRIVATE_KEY }}" | base64 -d > key.pem

      - name: Build CRX and ZIP
        run: |
          crx3 "$GITHUB_WORKSPACE" \
            --keyPath key.pem \
            --crxPath extension.crx \
            --zipPath extension.zip

      - name: Rename artifacts
        run: |
          mv extension.crx argo-rollup-helper-${{ steps.ver.outputs.value }}.crx
          mv extension.zip argo-rollup-helper-${{ steps.ver.outputs.value }}.zip

      - name: Publish release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            argo-rollup-helper-${{ steps.ver.outputs.value }}.crx \
            argo-rollup-helper-${{ steps.ver.outputs.value }}.zip
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
